<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Databillz by OM SANSKAR — Billing System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
    header { background: #2c3e50; color: #fff; padding: 20px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    main { padding: 20px; max-width: 900px; margin: auto; }
    h2 { color: #2c3e50; margin-top: 30px; }
    form, table, .actions, #summary, #userInfo {
      background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button {
      margin-top: 10px; padding: 10px 15px; background: #3498db; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; transition: 0.3s;
    }
    button:hover { background: #2980b9; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #3498db; color: #fff; }
    td button { background: red; margin: 0; padding: 5px 10px; }
    td button:hover { background: darkred; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Databillz Logo" style="height:60px; margin-bottom:10px;">
    <h1>📊 Databillz by OM SANSKAR</h1>
    <p>Smart Billing & Transaction Management</p>
    <!-- Google Sign-In button -->
    <div id="g_id_onload"
         data-client_id="457422547936-nd82lob0laca4vcs67b1neh6ur18sve3.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
  </header>

  <main id="app" style="display:none;">
    <div id="userInfo"></div>

    <h2>Add Transaction</h2>
    <form id="transactionForm">
      <label>Date: <input type="date" id="date" required></label>
      <label>Category:
        <select id="category" required>
          <option value="Cold Drinks">Cold Drinks</option>
          <option value="Recharge Services">Recharge Services</option>
          <option value="Cash Withdrawals">Cash Withdrawals</option>
          <option value="Other">Other</option>
        </select>
      </label>
      <label>Add Category:
        <input type="text" id="newCategory" placeholder="Enter new category">
        <button type="button" onclick="addCategory()">➕ Add Category</button>
      </label>
      <label>Item: <input type="text" id="item" placeholder="e.g. Pepsi, Jio" required></label>
      <label>Amount: <input type="number" id="amount" step="0.01" required></label>
      <button type="submit">➕ Add Entry</button>
    </form>

    <h2>Transactions</h2>
    <table id="transactionTable">
      <thead>
        <tr>
          <th>Date</th><th>Category</th><th>Item</th><th>Amount</th><th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="actions">
      <button onclick="viewSummary('daily')">📅 Daily View</button>
      <button onclick="viewSummary('monthly')">📆 Monthly View</button>
      <button onclick="viewSummary('yearly')">🗓️ Yearly View</button>
      <button onclick="exportPDF()">📄 Export PDF</button>
      <button onclick="exportExcel()">📊 Export Excel</button>
      <button onclick="deleteAllTransactions()" style="background:red;">🗑️ Delete All History</button>
    </div>

    <h2>Summary</h2>
    <div id="summary"></div>
  </main>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Libraries for export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

    const form = document.getElementById("transactionForm");
    const tableBody = document.querySelector("#transactionTable tbody");
    const summaryDiv = document.getElementById("summary");
    const appDiv = document.getElementById("app");
    const userInfoDiv = document.getElementById("userInfo");

    function renderTable() {
      tableBody.innerHTML = "";
      transactions.forEach((t, index) => {
        let row = `<tr>
          <td>${t.date}</td>
          <td>${t.category}</td>
          <td>${t.item}</td>
          <td>₹${t.amount.toFixed(2)}</td>
          <td><button onclick="deleteTransaction(${index})">❌ Remove</button></td>
        </tr>`;
        tableBody.innerHTML += row;
      });
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const transaction = {
        date: document.getElementById("date").value,
        category: document.getElementById("category").value,
        item: document.getElementById("item").value,
        amount: parseFloat(document.getElementById("amount").value)
      };
      transactions.push(transaction);
      localStorage.setItem("transactions", JSON.stringify(transactions));
      renderTable();
      form.reset();
    });

    function addCategory() {
      const newCat = document.getElementById("newCategory").value.trim();
      if (newCat) {
        const select = document.getElementById("category");
        const option = document.createElement("option");
        option.value = newCat;
        option.textContent = newCat;
        select.appendChild(option);
        document.getElementById("newCategory").value = "";
      }
    }

    function deleteTransaction(index) {
      transactions.splice(index, 1);
      localStorage.setItem("transactions", JSON.stringify(transactions));
      renderTable();
    }

    function deleteAllTransactions() {
      if (confirm("⚠️ Are you sure you want to delete ALL history? This cannot be undone.")) {
        transactions = [];
        localStorage.removeItem("transactions");
        renderTable();
        summaryDiv.innerHTML = "";
      }
    }

    function getDayName(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString("en-IN", { weekday: "long" });
    }

    function viewSummary(type) {
      let totals = {};
      if (type === "daily") {
        transactions.forEach(t => {
          const dayName = getDayName(t.date);
          const key = `${dayName}, ${t.date}`;
          totals[key] = (totals[key] || 0) + t.amount;
        });
      } else if (type === "monthly") {
        transactions.forEach(t => {
          let month = t.date.slice(0,7);
          totals[month] = (totals[month] || 0) + t.amount;
        });
      } else if (type === "yearly") {
        transactions.forEach(t => {
          let year = t.date.slice(0,4);
          totals[year] = (totals[year] || 0) + t.amount;
        });
      }
      summaryDiv.innerHTML = "<ul>" + Object.entries(totals).map(([k,v]) => `<li>${k}: ₹${v.toFixed(2)}</li>`).join("") + "</ul>";
    }
